<!-- Intro screen: shown once per visit, skipped for reduced motion. Lives outside #app so re-renders never touch it. -->
<div id="loader" aria-hidden="true">

  <div class="ld-layer ld-g"></div>
  <div class="ld-layer ld-b"></div>
  <div class="ld-layer ld-n">
    <img class="ld-crest" src="assets/logo-white.svg" alt="" />
    <div class="ld-word">BROOKLYN SDA</div>
    <svg class="ld-scribble" viewBox="0 0 300 24"><path d="M6 15 C 50 4, 90 22, 150 12 S 250 5, 294 14"/></svg>
    <div class="ld-pencils">
      <svg viewBox="0 0 220 24"><rect x="14" y="2" width="154" height="20" fill="#4A6FD0"/><rect x="0" y="2" width="14" height="20" fill="#F2A6B3"/><path d="M168 2 206 12 168 22z" fill="#F2D6A8"/><path d="M195 9.1 206 12 195 14.9z" fill="#4A6FD0"/></svg>

      <svg viewBox="0 0 220 24"><rect x="14" y="2" width="154" height="20" fill="#FFD24A"/><rect x="0" y="2" width="14" height="20" fill="#F2A6B3"/><path d="M168 2 206 12 168 22z" fill="#F2D6A8"/><path d="M195 9.1 206 12 195 14.9z" fill="#FFD24A"/></svg>

    </div>
  </div>
</div>
<script>
  (function () {
    var root = document.documentElement, loader = document.getElementById('loader'), skip = false;
    try { skip = sessionStorage.getItem('bsda-intro') === '1'; } catch (e) {}
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) skip = true;
    if (skip) { loader.parentNode.removeChild(loader); return; }
    try { sessionStorage.setItem('bsda-intro', '1'); } catch (e) {}
    root.classList.add('intro');
    setTimeout(function () { if (loader.parentNode) loader.parentNode.removeChild(loader); root.classList.remove('intro'); }, 2400);
  })();
</script>
